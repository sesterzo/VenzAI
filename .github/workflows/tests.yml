name: tests

# The plug-in runs inside Lightroom Classic, which no runner has. The suite
# does not need it: it drives the plug-in's Lua on the lua51 runtime embedded
# in lupa, with a harness that stands in for the SDK. So the whole suite runs
# headless on Linux, and the badge on the README states a fact somebody
# measured rather than a claim nobody checks.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Lua runtime the tests need
        run: python -m pip install -r tests/requirements.txt

      - name: Run the suite
        run: python tests/run.py

      # Not part of the suite: it compares the keys the source asks for with
      # the ones each translation file provides, and a missing key shows up in
      # Lightroom as a raw "$$$/VenzAI/..." token in place of a sentence.
      - name: Check every translation key is present
        run: python tests/check_translations.py
